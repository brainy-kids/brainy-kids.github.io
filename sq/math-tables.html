<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ushtrime Matematike — Kids Games 🎈</title>
<meta name="description" content="Gjenero dhe printo ushtrime matematike për fëmijë. Mbledhje, zbritje, shumëzim, pjesëtim." />
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/tailwind.min.css">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
:root { --bg: #fff8ec; --ink: #1f1147; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: 'Nunito', system-ui, sans-serif;
  background-image:
    radial-gradient(circle at 10% 10%, rgba(255,200,87,.25) 0, transparent 35%),
    radial-gradient(circle at 90% 20%, rgba(120,200,255,.25) 0, transparent 35%),
    radial-gradient(circle at 80% 90%, rgba(255,130,160,.22) 0, transparent 35%),
    radial-gradient(circle at 15% 85%, rgba(150,230,170,.25) 0, transparent 35%);
}
.display { font-family: 'Fredoka', system-ui, sans-serif; letter-spacing: -0.02em; }
.card    { border: 3px solid var(--ink); border-radius: 28px; box-shadow: 6px 6px 0 0 var(--ink); }
.pill    { border: 2px solid var(--ink); border-radius: 999px; box-shadow: 3px 3px 0 0 var(--ink); display: inline-block; }
.btn {
  border: 3px solid var(--ink); border-radius: 999px; padding: 9px 22px;
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: .9rem;
  cursor: pointer; box-shadow: 4px 4px 0 0 var(--ink);
  transition: transform .1s, box-shadow .1s; background: white; color: var(--ink);
}
.btn:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 0 var(--ink); }
.btn:active { transform: translate(2px,2px);   box-shadow: 1px 1px 0 0 var(--ink); }
.btn.on { background: var(--ink); color: #fff8ec; }

/* on mobile force Generate+Print to new row */
.act-break { display: none; }
@media (max-width: 639px) {
  .act-break { display: block; width: 100%; }
}

/* · number input · */
.num-input {
  border: 3px solid var(--ink); border-radius: 999px; padding: 9px 18px;
  font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 1rem;
  width: 72px; text-align: center; background: white; color: var(--ink);
  box-shadow: 4px 4px 0 0 var(--ink); outline: none;
  -moz-appearance: textfield;
}
.num-input::-webkit-inner-spin-button,
.num-input::-webkit-outer-spin-button { -webkit-appearance: none; }

/* · worksheet · */
#worksheet { display: none; }
.ws-header { margin-bottom: 18px; }
.ws-meta { display: flex; gap: 24px; margin-bottom: 8px; font-size: .9rem; font-weight: 700; flex-wrap: wrap; }
@media (max-width: 480px) { .ws-meta { flex-direction: column; gap: 10px; } }
.ws-meta span { border-bottom: 2px solid #333; min-width: 140px; padding-bottom: 2px; }
.ws-title { font-family: 'Fredoka', sans-serif; font-size: 1.6rem; font-weight: 600; margin-bottom: 4px; }
.problems-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 24px;
}
@media (max-width: 540px) {
  .problems-grid { grid-template-columns: 1fr; }
}
.problem {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Fredoka', sans-serif;
  font-size: 1.25rem;
  font-weight: 600;
  border-bottom: 2px solid #aaa;
  padding: 4px 0 2px;
}
.problem .num { min-width: 28px; text-align: right; }
.problem .op  { min-width: 20px; text-align: center; color: #555; }
.problem .eq  { margin-left: auto; color: #888; }
.problem-idx  { font-size: .75rem; color: #bbb; min-width: 20px; text-align: right; font-family: 'Nunito', sans-serif; }
.ans-input {
  width: 52px; border: none; border-bottom: 2.5px solid #333;
  background: transparent; font-family: 'Fredoka', sans-serif;
  font-size: 1.2rem; font-weight: 700; text-align: center;
  padding: 2px 4px; outline: none; margin-left: 4px;
  -moz-appearance: textfield;
}
.ans-input::-webkit-inner-spin-button,
.ans-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.ans-input.correct { color: #16a34a; border-color: #16a34a; }
.ans-input.wrong   { color: #dc2626; border-color: #dc2626; }

@media print {
  body > * { display: none !important; }
  body > main { display: block !important; padding: 0 !important; }
  main > *:not(#worksheet) { display: none !important; }
  #worksheet { display: block !important; box-shadow: none !important; border: none !important; padding: 0 !important; }
  .ans-input { color: #1f1147 !important; border-color: #333 !important; -webkit-appearance: none; -moz-appearance: textfield; }
  .ans-input.correct, .ans-input.wrong { color: #1f1147 !important; border-color: #333 !important; }
}
</style>
</head>
<body class="min-h-screen">

<main class="relative max-w-lg mx-auto px-5 py-8 md:py-12">

  <!-- · Nav · -->
  <div class="flex items-center justify-between mb-6">
    <a href="./" class="pill bg-white px-4 py-1 text-sm font-bold">← Kthehu</a>
    <div>
      <a href="../math-tables.html" class="pill bg-white px-3 py-1 text-xs font-bold">EN</a>
      <a href="../de/math-tables.html" class="pill bg-white px-3 py-1 text-xs font-bold ml-1">DE</a>
      <strong class="pill bg-[color:var(--ink)] text-[#fff8ec] px-3 py-1 text-xs font-bold ml-1">SQ</strong>
    </div>
  </div>

  <header class="text-center mb-6">
    <h1 class="display text-5xl md:text-6xl font-bold mb-1">Ushtrime Mat. ✏️</h1>
    <p class="font-semibold opacity-70">Zgjidh &amp; printo!</p>
  </header>

  <!-- · Operacioni · -->
  <div class="mb-5">
    <p class="font-bold mb-2 opacity-60 text-sm uppercase tracking-wide">Operacioni</p>
    <div class="flex gap-3 flex-wrap">
      <button class="btn on" id="op-add" onclick="setOp('add')">+ Mbledhje</button>
      <button class="btn"    id="op-sub" onclick="setOp('sub')">− Zbritje</button>
      <button class="btn"    id="op-mul" onclick="setOp('mul')">× Shumëzim</button>
      <button class="btn"    id="op-div" onclick="setOp('div')">÷ Pjesëtim</button>
    </div>
  </div>

  <!-- · Numri + Actions · -->
  <div class="mb-6">
    <p class="font-bold mb-2 opacity-60 text-sm uppercase tracking-wide">Numri <span class="normal-case font-normal opacity-80">(1 – 10)</span></p>
    <div class="flex flex-wrap items-center gap-3">
      <input id="num-input" type="number" class="num-input" min="1" max="10" value="1" oninput="setNumDirect(+this.value)">
      <button class="btn" onclick="setNum(0)">🎲 Random</button>
      <div class="act-break"></div>
      <button class="btn" style="background:#bbf7d0" onclick="generate()">Gjenero ↻</button>
      <button class="btn" onclick="printSheet()">Printo 🖨</button>
    </div>
  </div>

  <!-- · Worksheet · -->
  <div id="worksheet" class="card bg-white p-6 mb-6">
    <div class="ws-header">
      <div class="ws-title" id="ws-title"></div>
      <div class="ws-meta">
        <span>Emri: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span>Data: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
      </div>
    </div>
    <div class="problems-grid" id="problems-grid"></div>
  </div>

  <footer class="mt-10 text-center pb-6">
    <p class="font-semibold opacity-50 text-sm">Made with ❤️ for kids</p>
    <p class="mt-2 text-xs opacity-40 font-semibold">Designed &amp; built by <a href="https://shkelzenbaftijari.gitlab.io/" target="_blank" rel="noopener" class="underline hover:opacity-80">Shkelzen Baftijari</a> &middot; &copy; <span id="copy-yr"></span></p>
  </footer>

</main>

<script>
let op  = 'add';
let num = 0;
const count = 20;

const OP_LABELS = { add: 'Mbledhje +', sub: 'Zbritje −', mul: 'Shumëzim ×', div: 'Pjesëtim ÷' };

function setOp(o) {
  op = o;
  ['add','sub','mul','div'].forEach(k => document.getElementById('op-'+k).classList.toggle('on', k === o));
  generate();
}

function setNum(n) {
  num = n;
  document.getElementById('num-input').value = '';
  generate();
}

function setNumDirect(n) {
  if (n >= 1 && n <= 10) { num = n; generate(); }
}

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function makeProblem() {
  let a, b;
  if (op === 'add') {
    a = num > 0 ? num : rnd(1, 10);
    b = rnd(1, 10);
    if (Math.random() < .5) [a, b] = [b, a];
    return { a, sym: '+', b, ans: a + b };
  }
  if (op === 'sub') {
    b = num > 0 ? num : rnd(1, 10);
    a = b + rnd(0, 10);
    return { a, sym: '−', b, ans: a - b };
  }
  if (op === 'mul') {
    a = num > 0 ? num : rnd(1, 10);
    b = rnd(1, 10);
    if (Math.random() < .5) [a, b] = [b, a];
    return { a, sym: '×', b, ans: a * b };
  }
  if (op === 'div') {
    b = num > 0 ? num : rnd(1, 10);
    const q = rnd(1, 10);
    a = b * q;
    return { a, sym: '÷', b, ans: q };
  }
}

function numLabel() {
  if (num === 0) return 'Random';
  if (op === 'add') return `+ ${num}`;
  if (op === 'sub') return `− ${num}`;
  if (op === 'mul') return `Tabela e ${num}`;
  return `÷ ${num}`;
}

function generate() {
  const problems = Array.from({ length: count }, makeProblem);
  document.getElementById('ws-title').textContent =
    OP_LABELS[op] + (num > 0 ? ` — ${numLabel()}` : '');
  const grid = document.getElementById('problems-grid');
  grid.innerHTML = '';
  problems.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'problem';
    div.innerHTML =
      `<span class="problem-idx">${i+1}.</span>` +
      `<span class="num">${p.a}</span>` +
      `<span class="op">${p.sym}</span>` +
      `<span class="num">${p.b}</span>` +
      `<span class="eq">=</span>` +
      `<input type="number" class="ans-input" data-ans="${p.ans}" oninput="checkAns(this)" autocomplete="off">`;
    grid.appendChild(div);
  });
  document.getElementById('worksheet').style.display = 'block';
}

function checkAns(inp) {
  const val = inp.value.trim();
  if (val === '') { inp.className = 'ans-input'; return; }
  inp.className = +val === +inp.dataset.ans ? 'ans-input correct' : 'ans-input wrong';
}

function printSheet() {
  if (document.getElementById('worksheet').style.display === 'none') { generate(); }
  window.print();
}

generate();
</script>
<script>document.getElementById("copy-yr").textContent=new Date().getFullYear();</script>
</body>
</html>
