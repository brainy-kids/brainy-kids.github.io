<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Connect | Brainy Kids</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#fde9c9">
<link rel="stylesheet" href="../assets/css/fonts.css">

<style>
/* · CONNECT · Join the dots game — brainy-kids */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  background: linear-gradient(#fde9c9, #fcdcae);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

body {
  display: grid;
  place-items: center;
  padding-bottom: 10vh;
}

/* · 1. BACKGROUND · */

.scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.leaf {
  position: fixed;
  top: 0;
  left: var(--x);
  width: 14px;
  height: 8px;
  border-radius: 0 100%;
  background: var(--c);
  pointer-events: none;
  animation: fall var(--t) linear var(--d) infinite;
}

@keyframes fall {
  from { transform: translate(0, -5vh) rotate(0); }
  50%  { transform: translate(-8vw, 50vh) rotate(180deg); }
  to   { transform: translate(4vw, 108vh) rotate(360deg); }
}

/* · 2. TOP BAR · */

#bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 3;
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 14px 16px;
  font-family: 'Fredoka', sans-serif;
  color: #6b4f2a;
}

#bar button {
  min-width: 60px;
  height: 44px;
  border: 0;
  border-radius: 22px;
  background: rgba(255, 255, 255, .55);
  color: inherit;
  font: 600 17px 'Fredoka', sans-serif;
  cursor: pointer;
}

#bar button.on {
  background: #6b4f2a;
  color: #fff8ec;
}

/* · 3. BOARD · */

#stage {
  position: relative;
  z-index: 2;
  width: min(84vw, 58vh, 520px);
  aspect-ratio: 1;
}

#count {
  position: absolute;
  bottom: 100%;
  font: 600 18px 'Fredoka', sans-serif;
  font-variant-numeric: tabular-nums;
  color: #6b4f2a;
}

#board {
  width: 100%;
  height: 100%;
  overflow: visible;
  touch-action: none;
}

.grid {
  fill: none;
  stroke: #d4bf9f;
  stroke-width: .09;
  stroke-linecap: round;
}

.pts {
  fill: none;
  stroke: #c9b48f;
  stroke-width: .2;
  stroke-linecap: round;
}

.line {
  fill: none;
  stroke-width: .24;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.art {
  transform-box: fill-box;
  transform-origin: center;
  animation: pop .35s ease-out;
}

#board.won .art { animation: pulse .6s ease-in-out; }

@keyframes pop   { from { opacity: 0; transform: scale(.92); } }
@keyframes pulse { 50% { transform: scale(1.05); } }

@media (prefers-reduced-motion: reduce) {
  .leaf, .art, #board.won .art { animation: none; }
}
</style>
</head>
<body>

<!-- · BACKGROUND · -->
<svg class="scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <g fill="#fff" opacity=".85">
    <ellipse cx="90" cy="575" rx="42" ry="11"/>
    <ellipse cx="112" cy="564" rx="24" ry="13"/>
    <ellipse cx="290" cy="530" rx="38" ry="10"/>
    <ellipse cx="270" cy="520" rx="20" ry="11"/>
  </g>
  <path d="M0 650Q120 595 250 645T400 625V800H0Z" fill="#f4d79b"/>
  <path d="M0 705Q100 655 200 695T400 675V800H0Z" fill="#e9b766"/>
  <rect x="342" y="625" width="8" height="75" rx="4" fill="#8a7a3a"/>
  <ellipse cx="346" cy="600" rx="40" ry="46" fill="#6e6a2c"/>
</svg>

<div class="leaf" style="--x:12vw;--t:12s;--d:-2s;--c:#d9722b"></div>
<div class="leaf" style="--x:34vw;--t:15s;--d:-9s;--c:#c2412d"></div>
<div class="leaf" style="--x:56vw;--t:11s;--d:-5s;--c:#e8a33d"></div>
<div class="leaf" style="--x:72vw;--t:14s;--d:-12s;--c:#d9722b"></div>
<div class="leaf" style="--x:90vw;--t:13s;--d:-7s;--c:#c2412d"></div>

<!-- · TOP BAR · -->
<nav id="bar">
  <button data-n="4">3×3</button>
  <button data-n="5">4×4</button>
  <button data-n="6">5×5</button>
  <button data-n="7">6×6</button>
</nav>

<!-- · BOARD · -->
<div id="stage">
  <span id="count"></span>
  <svg id="board" oncontextmenu="return false"></svg>
</div>

<script src="levels.js"></script>
<script>
const COLORS = ['#f5c542', '#3b8eea', '#3fbf5a', '#f2556b', '#ff8a1f', '#8e5be8'];
const NS = 'http://www.w3.org/2000/svg';
const board = document.getElementById('board');
const count = document.getElementById('count');
const buttons = document.querySelectorAll('#bar button');
const SIZES = [...buttons].map((b) => +b.dataset.n);
const GENERATED = { 7: [5, 6] };
const FIXED = {};
window.CONNECT_LEVELS.forEach((l) => (FIXED[l[0]] = FIXED[l[0]] || []).push(l));

const total = (s) => (FIXED[s] ? FIXED[s].length : Infinity);
const saved = (s) => Math.min(+localStorage.getItem(`connect-${s}`) || 0, total(s) - 1);

// · GENERATOR · Seeded full-grid path cut into segments; level i of a size is always the same
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function segments(s, i) {
  const rnd = rng(s * 1e6 + i);
  const rint = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const cells = s * s;
  const dist = (g) => Math.abs((g[0] % s) - (g[g.length - 1] % s)) + Math.abs(Math.floor(g[0] / s) - Math.floor(g[g.length - 1] / s));
  const turns = (g) => g.reduce((t, v, k) => (k > 1 && v - g[k - 1] !== g[k - 1] - g[k - 2] ? t + 1 : t), 0);

  for (;;) {
    const p = [];
    for (let r = 0; r < s; r++) for (let c = 0; c < s; c++) p.push(r * s + (r % 2 ? s - 1 - c : c));
    for (let m = 0; m < 20 * cells; m++) {
      if (rnd() < .5) p.reverse();
      const end = p[cells - 1], r = Math.floor(end / s), c = end % s, nb = [];
      if (r > 0) nb.push(end - s);
      if (r < s - 1) nb.push(end + s);
      if (c > 0) nb.push(end - 1);
      if (c < s - 1) nb.push(end + 1);
      const j = p.indexOf(nb[rint(0, nb.length - 1)]);
      if (j < cells - 2) p.push(...p.splice(j + 1).reverse());
    }

    const k = rint(...GENERATED[s]);
    const len = Array(k).fill(3);
    for (let extra = cells - 3 * k; extra > 0; extra--) len[rint(0, k - 1)]++;
    let at = 0;
    const segs = len.map((l) => p.slice(at, (at += l)));

    const detour = segs.reduce((t, g) => t + g.length - 1 - dist(g), 0);
    if (detour >= s && segs.filter((g) => turns(g) >= 2).length >= 2) return segs;
  }
}

const levelData = (s, i) => (FIXED[s] ? FIXED[s][i] : [s, segments(s, i).map((g) => [g[0], g[g.length - 1]])]);

let size = SIZES.includes(+localStorage.getItem('connect-size')) ? +localStorage.getItem('connect-size') : SIZES[0];
let level = saved(size);
let n, dots, dotOf, paths, lines, timer, active = -1, locked = false;

const xy = (i) => [i % n, Math.floor(i / n)];
const adjacent = (a, b) => Math.abs(a - b) === n || (Math.abs(a - b) === 1 && Math.floor(a / n) === Math.floor(b / n));
const complete = (k) => paths[k].length > 1 && dotOf[paths[k][paths[k].length - 1]] === k;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}

function load() {
  clearTimeout(timer);
  [n, dots] = levelData(size, level);
  count.textContent = total(size) === Infinity ? level + 1 : `${level + 1}/${total(size)}`;
  buttons.forEach((b) => b.classList.toggle('on', +b.dataset.n === size));
  dotOf = Array(n * n).fill(-1);
  dots.forEach((pair, k) => pair.forEach((i) => (dotOf[i] = k)));
  paths = dots.map(() => []);
  locked = false;

  const span = n - 1 + 1.2;
  board.setAttribute('viewBox', `-.6 -.6 ${span} ${span}`);
  count.style.right = `${33 / span}%`;
  board.classList.remove('won');
  board.replaceChildren();

  const art = el('g', { class: 'art' }, board);
  let d = '';
  for (let i = 0; i < n; i++) d += `M0 ${i}H${n - 1}M${i} 0V${n - 1}`;
  el('path', { d, class: 'grid' }, art);
  let pts = '';
  for (let i = 0; i < n * n; i++) pts += `M${xy(i).join(' ')}h.001`;
  el('path', { d: pts, class: 'pts' }, art);
  lines = dots.map((_, k) => el('polyline', { class: 'line', stroke: COLORS[k] }, art));
  dots.forEach((pair, k) => pair.forEach((i) => {
    const [cx, cy] = xy(i);
    el('circle', { cx, cy, r: .27, fill: COLORS[k] }, art);
  }));
}

function draw() {
  paths.forEach((p, k) => lines[k].setAttribute('points', p.map((i) => xy(i).join(',')).join(' ')));
}

function nearest(e, radius) {
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(board.getScreenCTM().inverse());
  const x = Math.round(p.x), y = Math.round(p.y);
  if (x < 0 || y < 0 || x >= n || y >= n || Math.hypot(p.x - x, p.y - y) > radius) return -1;
  return y * n + x;
}

function win() {
  locked = true;
  active = -1;
  board.classList.add('won');
  level = (level + 1) % total(size);
  localStorage.setItem(`connect-${size}`, level);
  timer = setTimeout(load, 900);
}

buttons.forEach((b) => b.addEventListener('click', () => {
  size = +b.dataset.n;
  level = saved(size);
  localStorage.setItem('connect-size', size);
  load();
}));

board.addEventListener('pointerdown', (e) => {
  if (locked) return;
  const c = nearest(e, .7);
  if (c < 0) return;
  let k = dotOf[c];
  if (k >= 0) {
    paths[k] = [c];
  } else {
    k = paths.findIndex((q) => q.includes(c));
    if (k < 0) return;
    paths[k].length = paths[k].indexOf(c) + 1;
  }
  active = k;
  board.setPointerCapture(e.pointerId);
  draw();
});

board.addEventListener('pointermove', (e) => {
  if (active < 0) return;
  const p = paths[active];
  const c = nearest(e, .5);
  if (c < 0 || c === p[p.length - 1] || !adjacent(c, p[p.length - 1])) return;

  const back = p.indexOf(c);
  if (back >= 0) {
    p.length = back + 1;
  } else if (complete(active) || (dotOf[c] >= 0 && dotOf[c] !== active)) {
    return;
  } else {
    const other = paths.findIndex((q, k) => k !== active && q.includes(c));
    if (other >= 0) paths[other].length = paths[other].indexOf(c);
    p.push(c);
  }
  draw();
  if (paths.every((_, k) => complete(k)) && paths.reduce((t, q) => t + q.length, 0) === n * n) win();
});

const release = () => { active = -1; };
board.addEventListener('pointerup', release);
board.addEventListener('pointercancel', release);

load();
</script>
</body>
</html>
